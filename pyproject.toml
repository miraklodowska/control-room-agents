[project]
name = "control-room-agents"
version = "0.1.0"
description = "Fail-closed control room for bounded long-horizon agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "google-adk==2.7.0",
  "google-cloud-firestore==2.28.1",
  "pydantic==2.13.4",
  "uvicorn==0.52.3",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["control_room"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["control_room"]
